server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ad network re-reads this; never let it go stale.
    location = /app-ads.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    # privacy.html / tos.html / app-ads.txt are requested with their extension,
    # so $uri matches them as real files before anything below.
    #
    # $uri.html serves the per-route entry points built by scripts/og-routes.mjs
    # (/showcase -> showcase.html), which exist only so link previews are
    # route-specific — scrapers do not run the JS that would otherwise set them.
    # Extensionless paths with no matching file still fall through to the SPA.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
