server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # One host, one set of URLs. Cloudflare answers both www and the apex with
    # a 200, so without this the whole site exists twice and only the canonical
    # tag keeps them apart. Cloudflare passes the requested Host through, so the
    # redirect can live here rather than in a dashboard nobody has open.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ad network re-reads this; never let it go stale.
    location = /app-ads.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    # privacy.html / tos.html / app-ads.txt are requested with their extension,
    # so $uri matches them as real files before anything below.
    #
    # $uri.html serves the per-route entry points built by scripts/og-routes.mjs
    # (/showcase -> showcase.html), which exist so link previews are
    # route-specific — scrapers do not run the JS that would otherwise set them.
    #
    # There is deliberately no /index.html fallback: that arm made every URL on
    # the site return 200, so /sitemap.xml and every typo answered with the
    # homepage. Anything with no file behind it is a real 404 now, and
    # og-routes.mjs writes one file per route the app resolves — including
    # work-for-hire.html, which is a redirect in the app and would otherwise
    # 404 the one old URL the deployed footer still links.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # The SPA shell with a 404 status and a noindex, built by og-routes.mjs. The
    # app boots from it and renders the not-found screen for the path asked for.
    error_page 404 /404.html;
}
