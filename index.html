<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Social scrapers (Slack, Discord, LinkedIn, X) do not execute JavaScript,
      so these tags cannot be injected at runtime by the SPA. The second route
      gets its own copy of this file at build time — see scripts/og-routes.mjs.
      Keep the og: block contiguous; that script rewrites it by marker.
    -->
    <title>RIZ Games — Unity game development studio in Buenos Aires</title>
    <meta
      name="description"
      content="Unity co-development studio in Buenos Aires. Senior engineers for prototypes, whole builds and live services — on your design and your schedule."
    />
    <link rel="canonical" href="https://rizgames.com.ar/" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- og:start -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RIZ Games" />
    <meta property="og:url" content="https://rizgames.com.ar/" />
    <meta property="og:title" content="RIZ Games — Unity game development studio in Buenos Aires" />
    <meta
      property="og:description"
      content="Unity co-development studio in Buenos Aires. Senior engineers for prototypes, whole builds and live services — on your design and your schedule. From the engineers who built Focus Friend at Honey B Games, Google Play's App of the Year 2025."
    />
    <meta property="og:image" content="https://rizgames.com.ar/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:end -->

    <link rel="icon" type="image/png" href="./src/assets/images/RIZAvatar.png" />
    <link rel="apple-touch-icon" href="./src/assets/images/RIZAvatar.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@1,900&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
